# Dependabot version updates. Pull requests only — nothing merges on its own; CI runs the
# same build and tests on each one.
#
# cooldown: a release is proposed only once it has been out for 14 days, the same rule
# the test packages were last bumped by. Fresh releases are where regressions and
# compromised packages tend to surface; security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    groups:
      # Test-only packages move together: one PR, one CI run.
      test-packages:
        patterns:
          - "coverlet.*"
          - "xunit*"
    # LibreHardwareMonitorLib stays in a PR of its own. Before merging one, publish with a
    # RID and start the packaged build (deploy/README.md#releasing, step 8): it is a
    # RID-split package, and it decides which kernel driver is loaded.
    commit-message:
      prefix: "chore"
      include: "scope"

  # The workflow pins actions by commit SHA with the version in a trailing comment;
  # Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
